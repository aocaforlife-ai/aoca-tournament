<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Manage Players | AOCA</title>

<link rel="stylesheet" href="style.css">

<style>

.aoca-players-page{
    width:100%;
    max-width:1100px;
    margin:auto;
    padding:30px 18px 100px;
    box-sizing:border-box;
}

.aoca-players-back{
    background:none;
    border:none;
    color:#9aa4b8;
    font-size:15px;
    padding:0;
    margin-bottom:28px;
    cursor:pointer;
}

.aoca-players-title{
    color:#fff;
    font-size:34px;
    font-weight:900;
    margin:0 0 8px;
}

.aoca-players-subtitle{
    color:#7f899d;
    font-size:14px;
    margin:0 0 25px;
}

.aoca-players-message{
    display:none;
    padding:15px;
    border-radius:12px;
    margin-bottom:20px;
    line-height:1.5;
}

.aoca-players-error{
    display:block;
    color:#ff8585;
    background:rgba(255,80,80,.10);
    border:1px solid rgba(255,80,80,.30);
}

.aoca-players-success{
    display:block;
    color:#70e09b;
    background:rgba(70,220,130,.10);
    border:1px solid rgba(70,220,130,.30);
}


/* FILTERS */

.aoca-players-filters{
    background:#111722;
    border:1px solid #252d3d;
    border-radius:18px;
    padding:18px;
    margin-bottom:20px;
}

.aoca-players-filter-row{
    display:grid;
    grid-template-columns:1fr 1fr auto;
    gap:12px;
}

.aoca-players-input,
.aoca-players-select{
    width:100%;
    box-sizing:border-box;
    background:#0b1019;
    border:1px solid #2a3447;
    border-radius:10px;
    color:#fff;
    padding:13px;
    font-size:14px;
    outline:none;
}

.aoca-players-input:focus,
.aoca-players-select:focus{
    border-color:#7c8cff;
}

.aoca-players-refresh{
    border:none;
    border-radius:10px;
    padding:13px 18px;
    background:#7c8cff;
    color:#080b12;
    font-weight:900;
    cursor:pointer;
}


/* TABLE */

.aoca-players-card{
    background:#111722;
    border:1px solid #252d3d;
    border-radius:18px;
    padding:20px;
}

.aoca-players-card h2{
    color:#fff;
    font-size:20px;
    margin:0 0 18px;
}

.aoca-players-table-wrap{
    overflow-x:auto;
}

.aoca-players-table{
    width:100%;
    min-width:950px;
    border-collapse:collapse;
}

.aoca-players-table th{
    color:#7f899d;
    font-size:11px;
    text-align:left;
    padding:12px 8px;
    border-bottom:1px solid #252d3d;
}

.aoca-players-table td{
    color:#fff;
    font-size:13px;
    padding:15px 8px;
    border-bottom:1px solid #202837;
    vertical-align:middle;
}

.aoca-player-name{
    font-weight:900;
}

.aoca-player-muted{
    color:#8d97ab;
}

.aoca-player-paid{
    color:#70e09b;
    font-weight:900;
}

.aoca-player-pending-text{
    color:#f5c76b;
    font-weight:900;
}

.aoca-player-registered{
    color:#70e09b;
    font-weight:900;
}

.aoca-player-status-pending{
    color:#f5c76b;
    font-weight:900;
}


/* ACTION BUTTONS */

.aoca-player-action{
    border:none;
    border-radius:8px;
    padding:8px 11px;
    font-size:12px;
    font-weight:900;
    cursor:pointer;
    margin:2px;
}

.aoca-player-confirm{
    background:#70e09b;
    color:#07120b;
}

.aoca-player-pending{
    background:#f5c76b;
    color:#171105;
}

.aoca-player-delete{
    background:#ff6b6b;
    color:#170707;
}

.aoca-player-action:disabled{
    opacity:.5;
    cursor:not-allowed;
}


/* EMPTY */

.aoca-players-empty{
    text-align:center;
    color:#7f899d;
    padding:35px 15px;
}


/* MOBILE */

.aoca-mobile-players{
    display:none;
}

.aoca-player-mobile-card{
    background:#0b1019;
    border:1px solid #252d3d;
    border-radius:15px;
    padding:16px;
    margin-bottom:12px;
}

.aoca-mobile-player-name{
    color:#fff;
    font-size:17px;
    font-weight:900;
    word-break:break-word;
}

.aoca-mobile-player-game{
    color:#7f899d;
    font-size:12px;
    margin-top:4px;
}

.aoca-mobile-row{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:15px;
    padding:10px 0;
    border-top:1px solid #202837;
}

.aoca-mobile-label{
    color:#7f899d;
    font-size:12px;
    flex-shrink:0;
}

.aoca-mobile-value{
    color:#fff;
    font-size:13px;
    font-weight:700;
    text-align:right;
    word-break:break-word;
}

.aoca-mobile-actions{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
    margin-top:14px;
    padding-top:14px;
    border-top:1px solid #202837;
}

.aoca-mobile-actions .aoca-player-action{
    width:100%;
    margin:0;
    padding:11px 8px;
}

.aoca-mobile-actions .aoca-player-delete{
    grid-column:1/-1;
}


@media(max-width:700px){

    .aoca-players-page{
        padding:26px 16px 80px;
    }

    .aoca-players-title{
        font-size:30px;
    }

    .aoca-players-filter-row{
        grid-template-columns:1fr;
    }

    .aoca-players-refresh{
        width:100%;
    }

    .aoca-players-table-wrap{
        display:none;
    }

    .aoca-mobile-players{
        display:block;
    }

    .aoca-players-card{
        padding:16px;
    }

}

</style>

</head>


<body>


<header class="topbar">

<div class="logo">

AOCA

<span>
TOURNAMENT
</span>

</div>

</header>


<main class="aoca-players-page">


<button
type="button"
class="aoca-players-back"
id="playersBack"
>
← Back to Admin
</button>


<h1 class="aoca-players-title">
Manage Players
</h1>


<p class="aoca-players-subtitle">
View and manage tournament registrations.
</p>


<div
id="playersMessage"
class="aoca-players-message"
></div>


<div class="aoca-players-filters">


<div class="aoca-players-filter-row">


<input
id="playerSearch"
class="aoca-players-input"
type="search"
placeholder="Search player or Game UID..."
>


<select
id="tournamentFilter"
class="aoca-players-select"
>

<option value="">
All Tournaments
</option>

</select>


<button
type="button"
id="refreshPlayers"
class="aoca-players-refresh"
>
🔄 Refresh
</button>


</div>

</div>


<section class="aoca-players-card">


<h2>
Registered Players
</h2>


<div class="aoca-players-table-wrap">


<table class="aoca-players-table">


<thead>

<tr>

<th>
Player
</th>

<th>
Game UID
</th>

<th>
Tournament
</th>

<th>
Participation
</th>

<th>
Payment
</th>

<th>
Registration
</th>

<th>
Actions
</th>

</tr>

</thead>


<tbody
id="playersTable"
></tbody>


</table>


</div>


<div
id="mobilePlayers"
class="aoca-mobile-players"
></div>


</section>


</main>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>

"use strict";


console.log(
"AOCA MANAGE PLAYERS STARTED"
);


const SUPABASE_URL =
"https://onvcwcaimtazjlaysvvv.supabase.co";


const SUPABASE_KEY =
"sb_publishable_cy9fyHH3PJfUwxO0FBUjVQ_kj-8ojtX";


const supabaseClient =
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);


const ADMIN_EMAIL =
"aocaforlife@gmail.com";


const playersMessage =
document.getElementById(
"playersMessage"
);


const playersTable =
document.getElementById(
"playersTable"
);


const mobilePlayers =
document.getElementById(
"mobilePlayers"
);


const playerSearch =
document.getElementById(
"playerSearch"
);


const tournamentFilter =
document.getElementById(
"tournamentFilter"
);


let allRegistrations = [];


let allTournaments = [];



function escapeHtml(
value
){

return String(
value ?? ""
)

.replace(
/&/g,
"&amp;"
)

.replace(
/</g,
"&lt;"
)

.replace(
/>/g,
"&gt;"
)

.replace(
/"/g,
"&quot;"
)

.replace(
/'/g,
"&#039;"
);

}



function showMessage(
text,
type
){

playersMessage.textContent =
text;

playersMessage.className =
"aoca-players-message " +

(
type === "success"
?
"aoca-players-success"
:
"aoca-players-error"
);

}



async function checkAdmin(){

const sessionResult =
await supabaseClient
.auth
.getSession();


if(
sessionResult.error
){

throw sessionResult.error;

}


const session =
sessionResult
.data
.session;


if(!session){

window.location.href =
"login.html";

return null;

}


const user =
session.user;


if(
String(
user.email || ""
)
.toLowerCase()
!==
ADMIN_EMAIL
.toLowerCase()
){

throw new Error(
"Access denied. This account is not AOCA admin."
);

}


const adminResult =
await supabaseClient
.from(
"admin_users"
)
.select(
"user_id,email"
)
.eq(
"user_id",
user.id
)
.maybeSingle();


if(
adminResult.error
){

throw adminResult.error;

}


if(
!adminResult.data
){

throw new Error(
"Admin account is not registered."
);

}


return user;

}



async function loadData(){

try{


playersTable.innerHTML =
`
<tr>

<td
colspan="7"
class="aoca-players-empty"
>
Loading players...
</td>

</tr>
`;


mobilePlayers.innerHTML =
`
<div class="aoca-players-empty">
Loading players...
</div>
`;


await checkAdmin();



/*
LOAD TOURNAMENTS
*/

const tournamentResult =
await supabaseClient
.from(
"tournaments"
)
.select(
"id,name,game,created_at"
)
.order(
"created_at",
{
ascending:false
}
);


if(
tournamentResult.error
){

throw tournamentResult.error;

}


allTournaments =
tournamentResult.data || [];



const previousFilter =
tournamentFilter.value;


tournamentFilter.innerHTML =
`
<option value="">
All Tournaments
</option>
`;


allTournaments.forEach(
function(tournament){

const option =
document.createElement(
"option"
);

option.value =
tournament.id;

option.textContent =
tournament.name;

tournamentFilter
.appendChild(
option
);

}
);


if(
allTournaments.some(
function(tournament){

return String(
tournament.id
)
===
String(
previousFilter
);

}
)
){

tournamentFilter.value =
previousFilter;

}



/*
LOAD REGISTRATIONS
*/

const registrationResult =
await supabaseClient
.from(
"registrations"
)
.select(
"id,tournament_id,user_id,team_id,game_uid,in_game_name,participation_type,payment_status,registration_status,registered_at,razorpay_order_id,razorpay_payment_id,paid_at"
)
.order(
"registered_at",
{
ascending:false
}
);


if(
registrationResult.error
){

throw registrationResult.error;

}


allRegistrations =
registrationResult.data || [];


renderPlayers();


console.log(
"AOCA PLAYERS LOADED:",
allRegistrations
);


}

catch(error){

console.error(
"AOCA MANAGE PLAYERS ERROR:",
error
);


playersTable.innerHTML =
`
<tr>

<td
colspan="7"
class="aoca-players-empty"
>
Could not load players.
</td>

</tr>
`;


mobilePlayers.innerHTML =
`
<div class="aoca-players-empty">
Could not load players.
</div>
`;


showMessage(
"Could not load players: " +
error.message,
"error"
);

}

}



function renderPlayers(){

const search =
playerSearch
.value
.trim()
.toLowerCase();


const selectedTournament =
tournamentFilter.value;


const tournamentMap =
new Map();


allTournaments.forEach(
function(tournament){

tournamentMap.set(
String(
tournament.id
),
tournament
);

}
);


const filtered =
allRegistrations.filter(
function(item){

const playerName =
String(
item.in_game_name || ""
)
.toLowerCase();


const uid =
String(
item.game_uid || ""
)
.toLowerCase();


const matchesSearch =
!search ||
playerName.includes(
search
) ||
uid.includes(
search
);


const matchesTournament =
!selectedTournament ||
String(
item.tournament_id
) ===
String(
selectedTournament
);


return (
matchesSearch &&
matchesTournament
);

}
);


if(
!filtered.length
){

playersTable.innerHTML =
`
<tr>

<td
colspan="7"
class="aoca-players-empty"
>
No players found.
</td>

</tr>
`;


mobilePlayers.innerHTML =
`
<div class="aoca-players-empty">
No players found.
</div>
`;

return;

}


playersTable.innerHTML =
"";


mobilePlayers.innerHTML =
"";


filtered.forEach(
function(item){


const tournament =
tournamentMap.get(
String(
item.tournament_id
)
);


const paid =
String(
item.payment_status || ""
)
.toLowerCase()
===
"paid";


const registered =
String(
item.registration_status || ""
)
.toLowerCase()
===
"registered";


const playerName =
item.in_game_name ||
"Player";


const uid =
item.game_uid ||
"—";


const tournamentName =
tournament
?
tournament.name
:
"Tournament";


const participation =
item.participation_type ||
"—";


const paymentText =
paid
?
"PAID ✓"
:
"PENDING";


const registrationText =
item.registration_status ||
"pending";



/*
DESKTOP ROW
*/

const row =
document.createElement(
"tr"
);


row.innerHTML =

"<td>" +

"<div class='aoca-player-name'>" +

escapeHtml(
playerName
) +

"</div>" +

"</td>" +


"<td>" +

"<span class='aoca-player-muted'>" +

escapeHtml(
uid
) +

"</span>" +

"</td>" +


"<td>" +

escapeHtml(
tournamentName
) +

"</td>" +


"<td>" +

escapeHtml(
participation
) +

"</td>" +


"<td>" +

"<span class='" +

(
paid
?
"aoca-player-paid"
:
"aoca-player-pending-text"
) +

"'>" +

paymentText +

"</span>" +

"</td>" +


"<td>" +

"<span class='" +

(
registered
?
"aoca-player-registered"
:
"aoca-player-status-pending"
) +

"'>" +

escapeHtml(
registrationText
) +

"</span>" +

"</td>" +


"<td>" +

"<button " +
"class='aoca-player-action aoca-player-confirm' " +
"data-action='confirm' " +
"data-id='" +
escapeHtml(
item.id
) +
"'>" +

"✓ Confirm" +

"</button>" +


"<button " +
"class='aoca-player-action aoca-player-pending' " +
"data-action='pending' " +
"data-id='" +
escapeHtml(
item.id
) +
"'>" +

"⏳ Pending" +

"</button>" +


"<button " +
"class='aoca-player-action aoca-player-delete' " +
"data-action='delete' " +
"data-id='" +
escapeHtml(
item.id
) +
"'>" +

"🗑 Delete" +

"</button>" +

"</td>";


playersTable.appendChild(
row
);



/*
MOBILE CARD
*/

const card =
document.createElement(
"div"
);


card.className =
"aoca-player-mobile-card";


card.innerHTML =

"<div class='aoca-mobile-player-name'>" +

escapeHtml(
playerName
) +

"</div>" +


"<div class='aoca-mobile-player-game'>" +

escapeHtml(
tournament &&
tournament.game
?
tournament.game
:
"Tournament Player"
) +

"</div>" +


"<div class='aoca-mobile-row'>" +

"<span class='aoca-mobile-label'>Game UID</span>" +

"<span class='aoca-mobile-value'>" +

escapeHtml(
uid
) +

"</span>" +

"</div>" +


"<div class='aoca-mobile-row'>" +

"<span class='aoca-mobile-label'>Tournament</span>" +

"<span class='aoca-mobile-value'>" +

escapeHtml(
tournamentName
) +

"</span>" +

"</div>" +


"<div class='aoca-mobile-row'>" +

"<span class='aoca-mobile-label'>Participation</span>" +

"<span class='aoca-mobile-value'>" +

escapeHtml(
participation
) +

"</span>" +

"</div>" +


"<div class='aoca-mobile-row'>" +

"<span class='aoca-mobile-label'>Payment</span>" +

"<span class='aoca-mobile-value " +

(
paid
?
"aoca-player-paid"
:
"aoca-player-pending-text"
) +

"'>" +

paymentText +

"</span>" +

"</div>" +


"<div class='aoca-mobile-row'>" +

"<span class='aoca-mobile-label'>Registration</span>" +

"<span class='aoca-mobile-value " +

(
registered
?
"aoca-player-registered"
:
"aoca-player-status-pending"
) +

"'>" +

escapeHtml(
registrationText
) +

"</span>" +

"</div>" +


"<div class='aoca-mobile-actions'>" +


"<button " +
"class='aoca-player-action aoca-player-confirm' " +
"data-action='confirm' " +
"data-id='" +
escapeHtml(
item.id
) +
"'>" +

"✓ Confirm" +

"</button>" +


"<button " +
"class='aoca-player-action aoca-player-pending' " +
"data-action='pending' " +
"data-id='" +
escapeHtml(
item.id
) +
"'>" +

"⏳ Pending" +

"</button>" +


"<button " +
"class='aoca-player-action aoca-player-delete' " +
"data-action='delete' " +
"data-id='" +
escapeHtml(
item.id
) +
"'>" +

"🗑 Delete" +

"</button>" +


"</div>";


mobilePlayers.appendChild(
card
);

}
);

}



async function updateRegistration(
id,
status
){

try{


const result =
await supabaseClient
.from(
"registrations"
)
.update({
registration_status:
status
})
.eq(
"id",
id
);


if(
result.error
){

throw result.error;

}


showMessage(
"Registration updated successfully.",
"success"
);


await loadData();


}

catch(error){

console.error(
"UPDATE REGISTRATION ERROR:",
error
);


showMessage(
"Could not update registration: " +
error.message,
"error"
);

}

}



async function deleteRegistration(
id
){

const confirmed =
window.confirm(
"Delete this registration? This cannot be undone."
);


if(!confirmed){

return;

}


try{


const result =
await supabaseClient
.from(
"registrations"
)
.delete()
.eq(
"id",
id
);


if(
result.error
){

throw result.error;

}


showMessage(
"Registration deleted successfully.",
"success"
);


await loadData();


}

catch(error){

console.error(
"DELETE REGISTRATION ERROR:",
error
);


showMessage(
"Could not delete registration: " +
error.message,
"error"
);

}

}



function handlePlayerAction(
event
){

const button =
event.target.closest(
"button[data-action]"
);


if(!button){

return;

}


const id =
button.dataset.id;


const action =
button.dataset.action;


if(!id){

return;

}


if(
action === "confirm"
){

updateRegistration(
id,
"registered"
);

}

else if(
action === "pending"
){

updateRegistration(
id,
"pending"
);

}

else if(
action === "delete"
){

deleteRegistration(
id
);

}

}



playersTable.addEventListener(
"click",
handlePlayerAction
);


mobilePlayers.addEventListener(
"click",
handlePlayerAction
);


playerSearch.addEventListener(
"input",
renderPlayers
);


tournamentFilter.addEventListener(
"change",
renderPlayers
);



document
.getElementById(
"refreshPlayers"
)
.addEventListener(
"click",
async function(){

showMessage(
"Refreshing players...",
"success"
);

await loadData();

}
);



document
.getElementById(
"playersBack"
)
.addEventListener(
"click",
function(){

window.location.href =
"admin.html";

}
);



loadData();


console.log(
"AOCA MANAGE PLAYERS READY"
);

</script>

</body>

</html>
