<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Profile | AOCA Tournament</title>

<link rel="stylesheet" href="style.css">

<style>

.profile-page{
    padding:28px 20px 100px;
    max-width:600px;
    margin:auto;
}

.profile-back{
    background:none;
    border:none;
    color:#9aa4b8;
    font-size:14px;
    padding:0;
    margin-bottom:25px;
    cursor:pointer;
}

.profile-heading{
    font-size:30px;
    margin:0 0 8px;
}

.profile-subtitle{
    color:#7f899d;
    font-size:13px;
    margin-bottom:25px;
}

.profile-card{
    background:#111722;
    border:1px solid #252d3d;
    border-radius:16px;
    padding:22px;
    margin-bottom:18px;
}

.profile-top{
    display:flex;
    align-items:center;
    gap:15px;
}

.profile-avatar{
    width:64px;
    height:64px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#7c8cff;
    color:#080b12;
    font-size:24px;
    font-weight:900;
}

.profile-name{
    color:white;
    font-size:20px;
    font-weight:800;
}

.profile-username{
    color:#8d9aff;
    font-size:12px;
    margin-top:5px;
}

.section-title{
    color:white;
    font-size:16px;
    margin-bottom:18px;
}

.profile-row{
    display:flex;
    justify-content:space-between;
    gap:15px;
    padding:14px 0;
    border-bottom:1px solid #202837;
}

.profile-row:last-child{
    border-bottom:none;
}

.profile-row-label{
    color:#7f899d;
    font-size:12px;
}

.profile-row-value{
    color:white;
    font-size:13px;
    font-weight:700;
    text-align:right;
    word-break:break-word;
}

.wallet-card{
    display:flex;
    align-items:center;
    justify-content:space-between;
}

.wallet-label{
    color:#7f899d;
    font-size:11px;
}

.wallet-balance{
    color:white;
    font-size:28px;
    font-weight:900;
    margin-top:5px;
}

.wallet-icon{
    font-size:32px;
}

.profile-action,
.logout-button{
    width:100%;
    height:48px;
    border-radius:10px;
    margin-top:10px;
    cursor:pointer;
    font-weight:800;
}

.profile-action{
    background:#171e2c;
    border:1px solid #293246;
    color:white;
}

.profile-action:active{
    transform:scale(.99);
}

.logout-button{
    height:50px;
    background:rgba(255,70,80,.08);
    border:1px solid #5a2b35;
    color:#ff858f;
}

.profile-message{
    display:none;
    padding:13px;
    margin-bottom:18px;
    border-radius:10px;
    font-size:12px;
    line-height:1.5;
}

.error{
    display:block;
    background:rgba(255,80,80,.10);
    border:1px solid rgba(255,80,80,.30);
    color:#ff8585;
}

.success{
    display:block;
    background:rgba(64,200,130,.10);
    border:1px solid rgba(64,200,130,.30);
    color:#62d89a;
}

</style>

</head>


<body>


<header class="topbar">

    <div class="logo">
        AOCA
        <span>TOURNAMENT</span>
    </div>

    <button
        class="login-btn"
        id="headerLogout"
        type="button"
    >
        Logout
    </button>

</header>


<main class="profile-page">


    <button
        class="profile-back"
        id="backButton"
        type="button"
    >
        ← Back
    </button>


    <h1 class="profile-heading">
        My Profile
    </h1>


    <p class="profile-subtitle">
        Manage your AOCA Tournament account.
    </p>


    <div
        id="profileMessage"
        class="profile-message"
    ></div>


    <!-- PROFILE -->

    <section class="profile-card">

        <div class="profile-top">

            <div
                class="profile-avatar"
                id="profileAvatar"
            >
                A
            </div>

            <div>

                <div
                    class="profile-name"
                    id="profileName"
                >
                    Loading...
                </div>

                <div
                    class="profile-username"
                    id="profileUsername"
                >
                    @loading
                </div>

            </div>

        </div>

    </section>


    <!-- ACCOUNT -->

    <section class="profile-card">

        <h2 class="section-title">
            Account Information
        </h2>


        <div class="profile-row">

            <span class="profile-row-label">
                Full Name
            </span>

            <span
                class="profile-row-value"
                id="fullName"
            >
                —
            </span>

        </div>


        <div class="profile-row">

            <span class="profile-row-label">
                Email
            </span>

            <span
                class="profile-row-value"
                id="email"
            >
                —
            </span>

        </div>


        <div class="profile-row">

            <span class="profile-row-label">
                Username
            </span>

            <span
                class="profile-row-value"
                id="username"
            >
                —
            </span>

        </div>


        <div class="profile-row">

            <span class="profile-row-label">
                Account Created
            </span>

            <span
                class="profile-row-value"
                id="createdAt"
            >
                —
            </span>

        </div>

    </section>


    <!-- WALLET -->

    <section class="profile-card wallet-card">

        <div>

            <div class="wallet-label">
                WALLET BALANCE
            </div>

            <div class="wallet-balance">
                ₹0.00
            </div>

        </div>

        <div class="wallet-icon">
            💰
        </div>

    </section>


    <!-- TOURNAMENT -->

    <section class="profile-card">

        <h2 class="section-title">
            Tournament
        </h2>


        <button
            class="profile-action"
            id="browseButton"
            type="button"
        >
            🏆 Browse Tournaments
        </button>


        <button
            class="profile-action"
            id="myTournamentsButton"
            type="button"
        >
            🎮 My Tournaments
        </button>

    </section>


    <!-- LOGOUT -->

    <button
        class="logout-button"
        id="logoutButton"
        type="button"
    >
        LOGOUT
    </button>


</main>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>

"use strict";


/* =====================================
   SUPABASE
===================================== */

const SUPABASE_URL =
    "https://onvcwcaimtazjlaysvvv.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_cy9fyHH3PJfUwxO0FBUjVQ_kj-8ojtX";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =====================================
   ELEMENTS
===================================== */

const message =
    document.getElementById(
        "profileMessage"
    );

const profileName =
    document.getElementById(
        "profileName"
    );

const profileUsername =
    document.getElementById(
        "profileUsername"
    );

const profileAvatar =
    document.getElementById(
        "profileAvatar"
    );

const fullName =
    document.getElementById(
        "fullName"
    );

const email =
    document.getElementById(
        "email"
    );

const username =
    document.getElementById(
        "username"
    );

const createdAt =
    document.getElementById(
        "createdAt"
    );

const browseButton =
    document.getElementById(
        "browseButton"
    );

const myTournamentsButton =
    document.getElementById(
        "myTournamentsButton"
    );

const logoutButton =
    document.getElementById(
        "logoutButton"
    );

const headerLogout =
    document.getElementById(
        "headerLogout"
    );

const backButton =
    document.getElementById(
        "backButton"
    );


/* =====================================
   ERROR MESSAGE
===================================== */

function showError(text){

    message.textContent =
        text;

    message.className =
        "profile-message error";

}


/* =====================================
   LOAD PROFILE
===================================== */

async function loadProfile(){

    try{

        console.log(
            "AOCA: Loading session..."
        );


        const result =
            await supabaseClient
                .auth
                .getSession();


        if(result.error){

            throw result.error;

        }


        const session =
            result.data.session;


        if(!session){

            window.location.href =
                "login.html";

            return;

        }


        const user =
            session.user;


        console.log(
            "AOCA USER:",
            user.id
        );


        const result2 =
            await supabaseClient
                .from("profiles")
                .select(
                    "id,username,full_name,created_at"
                )
                .eq(
                    "id",
                    user.id
                )
                .maybeSingle();


        if(result2.error){

            throw result2.error;

        }


        const profile =
            result2.data;


        const metadata =
            user.user_metadata || {};


        const name =
            profile?.full_name ||
            metadata.full_name ||
            "AOCA Player";


        const userName =
            profile?.username ||
            metadata.username ||
            "player";


        profileName.textContent =
            name;


        profileUsername.textContent =
            "@" + userName;


        fullName.textContent =
            name;


        email.textContent =
            user.email || "—";


        username.textContent =
            "@" + userName;


        profileAvatar.textContent =
            name
                .charAt(0)
                .toUpperCase();


        const dateValue =
            profile?.created_at ||
            user.created_at;


        if(dateValue){

            createdAt.textContent =
                new Date(
                    dateValue
                ).toLocaleDateString(
                    "en-IN",
                    {
                        day:"2-digit",
                        month:"short",
                        year:"numeric"
                    }
                );

        }


        console.log(
            "AOCA: Profile loaded!"
        );

    }

    catch(error){

        console.error(
            "AOCA PROFILE ERROR:",
            error
        );


        showError(
            "Unable to load profile: " +
            (
                error.message ||
                "Unknown error"
            )
        );

    }

}


/* =====================================
   BROWSE TOURNAMENTS
===================================== */

browseButton.addEventListener(
    "click",
    function(){

        console.log(
            "AOCA: Browse tournaments clicked"
        );


        window.location.href =
            "tournaments.html";

    }
);


/* =====================================
   MY TOURNAMENTS
===================================== */

myTournamentsButton.addEventListener(
    "click",
    function(){

        console.log(
            "AOCA: My tournaments clicked"
        );


        window.location.href =
            "my-tournaments.html";

    }
);


/* =====================================
   BACK
===================================== */

backButton.addEventListener(
    "click",
    function(){

        if(
            document.referrer &&
            document.referrer.includes(
                window.location.hostname
            )
        ){

            history.back();

        }else{

            window.location.href =
                "index.html";

        }

    }
);


/* =====================================
   LOGOUT
===================================== */

async function logout(){

    try{

        const result =
            await supabaseClient
                .auth
                .signOut();


        if(result.error){

            throw result.error;

        }


        localStorage.removeItem(
            "selectedTournamentId"
        );

        localStorage.removeItem(
            "selectedTournament"
        );

        localStorage.removeItem(
            "selectedGame"
        );


        window.location.href =
            "login.html";

    }

    catch(error){

        console.error(
            "AOCA LOGOUT ERROR:",
            error
        );


        showError(
            "Logout failed: " +
            (
                error.message ||
                "Unknown error"
            )
        );

    }

}


logoutButton.addEventListener(
    "click",
    logout
);


headerLogout.addEventListener(
    "click",
    logout
);


/* =====================================
   START
===================================== */

loadProfile();


console.log(
    "AOCA PROFILE PAGE READY 🏆"
);

</script>


</body>

</html>
