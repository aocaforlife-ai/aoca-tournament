<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Create Tournament | AOCA</title>

<link rel="stylesheet" href="style.css">

<style>

.aoca-create-page{
    width:100%;
    max-width:680px;
    margin:auto;
    padding:30px 18px 100px;
    box-sizing:border-box;
}

.aoca-create-back{
    background:none;
    border:0;
    color:#9aa4b8;
    font-size:15px;
    padding:0;
    margin-bottom:28px;
    cursor:pointer;
}

.aoca-create-title{
    color:#fff;
    font-size:34px;
    font-weight:900;
    margin:0 0 8px;
}

.aoca-create-subtitle{
    color:#7f899d;
    font-size:14px;
    margin:0 0 30px;
}

.aoca-create-card{
    background:#111722;
    border:1px solid #252d3d;
    border-radius:18px;
    padding:20px;
}

.aoca-create-group{
    margin-bottom:20px;
}

.aoca-create-label{
    display:block;
    color:#c7cedc;
    font-size:13px;
    font-weight:800;
    margin-bottom:8px;
}

.aoca-create-input,
.aoca-create-select,
.aoca-create-textarea{
    width:100%;
    box-sizing:border-box;
    background:#0b1019;
    border:1px solid #2a3447;
    border-radius:10px;
    color:#fff;
    padding:14px;
    font-size:15px;
    outline:none;
}

.aoca-create-input:focus,
.aoca-create-select:focus,
.aoca-create-textarea:focus{
    border-color:#7c8cff;
}

.aoca-create-textarea{
    min-height:100px;
    resize:vertical;
}

.aoca-create-row{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:14px;
}

.aoca-create-message{
    display:none;
    padding:14px;
    margin-bottom:20px;
    border-radius:10px;
    font-size:14px;
    line-height:1.5;
}

.aoca-create-error{
    display:block;
    color:#ff8585;
    background:rgba(255,80,80,.10);
    border:1px solid rgba(255,80,80,.30);
}

.aoca-create-success{
    display:block;
    color:#70e09b;
    background:rgba(70,220,130,.10);
    border:1px solid rgba(70,220,130,.30);
}

.aoca-create-button{
    width:100%;
    height:52px;
    border:0;
    border-radius:11px;
    background:#7c8cff;
    color:#080b12;
    font-size:15px;
    font-weight:900;
    cursor:pointer;
}

.aoca-create-button:disabled{
    opacity:.6;
    cursor:not-allowed;
}

@media(max-width:480px){

    .aoca-create-page{
        padding:26px 16px 80px;
    }

    .aoca-create-row{
        grid-template-columns:1fr;
    }

    .aoca-create-title{
        font-size:30px;
    }

}

</style>

</head>


<body>


<header class="topbar">

    <div class="logo">
        AOCA
        <span>TOURNAMENT</span>
    </div>

</header>


<main class="aoca-create-page">


<button
    type="button"
    class="aoca-create-back"
    id="aocaCreateBack"
>
    ← Back to Admin
</button>


<h1 class="aoca-create-title">
    Create Tournament
</h1>


<p class="aoca-create-subtitle">
    Create a new tournament for players to join.
</p>


<div
    id="aocaCreateMessage"
    class="aoca-create-message"
></div>


<div class="aoca-create-card">


<!-- NAME -->

<div class="aoca-create-group">

<label class="aoca-create-label">
Tournament Name
</label>

<input
    id="aocaName"
    class="aoca-create-input"
    type="text"
    placeholder="AOCA BGMI Battle #002"
>

</div>


<!-- GAME -->

<div class="aoca-create-group">

<label class="aoca-create-label">
Game
</label>

<select
    id="aocaGame"
    class="aoca-create-select"
>

<option value="BGMI">
BGMI
</option>

<option value="Free Fire">
Free Fire
</option>

<option value="COD Mobile">
COD Mobile
</option>

<option value="Other">
Other
</option>

</select>

</div>


<!-- DESCRIPTION -->

<div class="aoca-create-group">

<label class="aoca-create-label">
Description
</label>

<textarea
    id="aocaDescription"
    class="aoca-create-textarea"
    placeholder="Tournament details..."
></textarea>

</div>


<!-- ENTRY / PRIZE -->

<div class="aoca-create-row">


<div class="aoca-create-group">

<label class="aoca-create-label">
Entry Fee (₹)
</label>

<input
    id="aocaEntryFee"
    class="aoca-create-input"
    type="number"
    min="0"
    value="20"
>

</div>


<div class="aoca-create-group">

<label class="aoca-create-label">
Prize Pool (₹)
</label>

<input
    id="aocaPrizePool"
    class="aoca-create-input"
    type="number"
    min="0"
    value="0"
>

</div>


</div>


<!-- MAX PLAYERS -->

<div class="aoca-create-group">

<label class="aoca-create-label">
Maximum Players
</label>

<input
    id="aocaMaxPlayers"
    class="aoca-create-input"
    type="number"
    min="1"
    value="100"
>

</div>


<!-- MODE / MAP -->

<div class="aoca-create-row">


<div class="aoca-create-group">

<label class="aoca-create-label">
Mode
</label>

<select
    id="aocaMode"
    class="aoca-create-select"
>

<option value="Solo">
Solo
</option>

<option value="Duo">
Duo
</option>

<option value="Squad">
Squad
</option>

</select>

</div>


<div class="aoca-create-group">

<label class="aoca-create-label">
Map
</label>

<input
    id="aocaMap"
    class="aoca-create-input"
    type="text"
    value="Erangel"
    placeholder="Erangel"
>

</div>


</div>


<!-- START -->

<div class="aoca-create-group">

<label class="aoca-create-label">
Tournament Start
</label>

<input
    id="aocaStartTime"
    class="aoca-create-input"
    type="datetime-local"
>

</div>


<!-- DEADLINE -->

<div class="aoca-create-group">

<label class="aoca-create-label">
Registration Deadline
</label>

<input
    id="aocaDeadline"
    class="aoca-create-input"
    type="datetime-local"
>

</div>


<!-- RULES -->

<div class="aoca-create-group">

<label class="aoca-create-label">
Rules
</label>

<textarea
    id="aocaRules"
    class="aoca-create-textarea"
    placeholder="Enter tournament rules..."
></textarea>

</div>


<!-- IMAGE -->

<div class="aoca-create-group">

<label class="aoca-create-label">
Image URL
</label>

<input
    id="aocaImageUrl"
    class="aoca-create-input"
    type="url"
    placeholder="https://..."
>

</div>


<button
    type="button"
    id="aocaCreateButton"
    class="aoca-create-button"
>
🏆 Create Tournament
</button>


</div>

</main>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>

"use strict";


/* ================================
   SUPABASE
================================ */

const SUPABASE_URL =
"https://onvcwcaimtazjlaysvvv.supabase.co";

const SUPABASE_KEY =
"sb_publishable_cy9fyHH3PJfUwxO0FBUjVQ_kj-8ojtX";

const db =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* ================================
   ELEMENTS
================================ */

const message =
document.getElementById(
    "aocaCreateMessage"
);

const createButton =
document.getElementById(
    "aocaCreateButton"
);


/* ================================
   MESSAGE
================================ */

function showMessage(
    text,
    type
){

    message.textContent =
        text;

    message.className =
        "aoca-create-message " +
        (
            type === "success"
                ? "aoca-create-success"
                : "aoca-create-error"
        );
}


/* ================================
   SLUG
================================ */

function makeSlug(
    name
){

    return name
        .toLowerCase()
        .trim()
        .replace(
            /[^a-z0-9]+/g,
            "-"
        )
        .replace(
            /^-+|-+$/g,
            ""
        ) +
        "-" +
        Date.now();
}


/* ================================
   ADMIN CHECK
================================ */

async function checkAdmin(){

    const sessionResult =
        await db.auth.getSession();

    if(
        sessionResult.error
    ){

        throw sessionResult.error;

    }

    const session =
        sessionResult
            .data
            .session;

    if(!session){

        window.location.href =
            "login.html";

        return null;
    }

    const user =
        session.user;

    const adminResult =
        await db
            .from("admin_users")
            .select(
                "user_id,email"
            )
            .eq(
                "user_id",
                user.id
            )
            .maybeSingle();

    if(
        adminResult.error
    ){

        throw adminResult.error;

    }

    if(
        !adminResult.data
    ){

        throw new Error(
            "You are not authorized as admin."
        );

    }

    return user;
}


/* ================================
   CREATE TOURNAMENT
================================ */

async function createTournament(){

    createButton.disabled =
        true;

    createButton.textContent =
        "CREATING...";

    showMessage(
        "Creating tournament...",
        "success"
    );


    try{

        const user =
            await checkAdmin();

        if(!user){

            return;

        }


        /* READ FORM */

        const name =
            document
                .getElementById(
                    "aocaName"
                )
                .value
                .trim();


        const game =
            document
                .getElementById(
                    "aocaGame"
                )
                .value;


        const description =
            document
                .getElementById(
                    "aocaDescription"
                )
                .value
                .trim();


        const entryFee =
            Number(
                document
                    .getElementById(
                        "aocaEntryFee"
                    )
                    .value
            );


        const prizePool =
            Number(
                document
                    .getElementById(
                        "aocaPrizePool"
                    )
                    .value
            );


        const maxPlayers =
            Number(
                document
                    .getElementById(
                        "aocaMaxPlayers"
                    )
                    .value
            );


        const mode =
            document
                .getElementById(
                    "aocaMode"
                )
                .value;


        const map =
            document
                .getElementById(
                    "aocaMap"
                )
                .value
                .trim();


        const startTime =
            document
                .getElementById(
                    "aocaStartTime"
                )
                .value;


        const deadline =
            document
                .getElementById(
                    "aocaDeadline"
                )
                .value;


        const rules =
            document
                .getElementById(
                    "aocaRules"
                )
                .value
                .trim();


        const imageUrl =
            document
                .getElementById(
                    "aocaImageUrl"
                )
                .value
                .trim();


        /* VALIDATION */

        if(!name){

            throw new Error(
                "Tournament name is required."
            );

        }


        if(
            !Number.isFinite(entryFee) ||
            entryFee < 0
        ){

            throw new Error(
                "Enter a valid entry fee."
            );

        }


        if(
            !Number.isFinite(prizePool) ||
            prizePool < 0
        ){

            throw new Error(
                "Enter a valid prize pool."
            );

        }


        if(
            !Number.isInteger(maxPlayers) ||
            maxPlayers < 1
        ){

            throw new Error(
                "Enter a valid maximum player count."
            );

        }


        if(!startTime){

            throw new Error(
                "Tournament start time is required."
            );

        }


        const startDate =
            new Date(
                startTime
            );


        if(
            Number.isNaN(
                startDate.getTime()
            )
        ){

            throw new Error(
                "Invalid tournament start time."
            );

        }


        let deadlineDate =
            null;


        if(deadline){

            deadlineDate =
                new Date(
                    deadline
                );


            if(
                Number.isNaN(
                    deadlineDate.getTime()
                )
            ){

                throw new Error(
                    "Invalid registration deadline."
                );

            }

        }


        if(
            deadlineDate &&
            deadlineDate >= startDate
        ){

            throw new Error(
                "Registration deadline must be before tournament start."
            );

        }


        /* GAME ID */

        let gameId =
            null;


        if(game === "BGMI"){

            gameId = 1;

        }
        else if(
            game === "Free Fire"
        ){

            gameId = 2;

        }


        /* TOURNAMENT DATA */

        const tournamentData = {

            name:
                name,

            description:
                description || null,

            game:
                game,

            game_id:
                gameId,

            entry_fee:
                entryFee,

            prize_pool:
                prizePool,

            max_players:
                maxPlayers,

            current_players:
                0,

            mode:
                mode,

            map:
                map || null,

            start_time:
                startDate.toISOString(),

            tournament_date:
                startDate.toISOString(),

            registration_deadline:
                deadlineDate
                    ? deadlineDate.toISOString()
                    : null,

            rules:
                rules || null,

            image_url:
                imageUrl || null,

            status:
                "upcoming",

            created_by:
                user.id,

            slug:
                makeSlug(name)

        };


        console.log(
            "AOCA TOURNAMENT DATA:",
            tournamentData
        );


        /* CREATE TOURNAMENT */

        const tournamentResult =
            await db
                .from("tournaments")
                .insert(
                    tournamentData
                )
                .select()
                .single();


        if(
            tournamentResult.error
        ){

            throw tournamentResult.error;

        }


        const createdTournament =
            tournamentResult.data;


        console.log(
            "TOURNAMENT CREATED:",
            createdTournament
        );


        /* ============================
           CREATE MATCH #1
        ============================ */

        const matchResult =
            await db
                .from("matches")
                .insert({

                    tournament_id:
                        createdTournament.id,

                    match_number:
                        1,

                    status:
                        "scheduled"

                })
                .select()
                .single();


        if(
            matchResult.error
        ){

            /*
                Tournament was created,
                but Match #1 failed.
            */

            console.error(
                "MATCH CREATION ERROR:",
                matchResult.error
            );


            showMessage(
                "Tournament created, but Match #1 could not be created: " +
                matchResult.error.message,
                "error"
            );


            createButton.disabled =
                false;

            createButton.textContent =
                "🏆 Create Tournament";

            return;

        }


        console.log(
            "MATCH #1 CREATED:",
            matchResult.data
        );


        /* SAVE CURRENT TOURNAMENT */

        localStorage.setItem(
            "selectedTournamentId",
            createdTournament.id
        );

        localStorage.setItem(
            "selectedTournament",
            createdTournament.name || ""
        );

        localStorage.setItem(
            "selectedGame",
            createdTournament.game || ""
        );


        /* SUCCESS */

        showMessage(
            "Tournament and Match #1 created successfully! 🏆",
            "success"
        );


        setTimeout(
            function(){

                window.location.href =
                    "admin.html";

            },
            1200
        );

    }
    catch(error){

        console.error(
            "AOCA CREATE ERROR:",
            error
        );


        showMessage(
            "Could not create tournament: " +
            (
                error.message ||
                "Unknown error"
            ),
            "error"
        );

    }
    finally{

        createButton.disabled =
            false;

        createButton.textContent =
            "🏆 Create Tournament";

    }

}


/* ================================
   EVENTS
================================ */

createButton.addEventListener(
    "click",
    createTournament
);


document
    .getElementById(
        "aocaCreateBack"
    )
    .addEventListener(
        "click",
        function(){

            window.location.href =
                "admin.html";

        }
    );


console.log(
    "AOCA CREATE TOURNAMENT READY 🏆"
);

</script>


</body>

</html>
